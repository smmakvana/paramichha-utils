name: Verify merged projects on Windows

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    if: github.head_ref == 'codex/verify-merged-windows'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Configure Windows checkout
        run: |
          git config --global core.autocrlf true
          git config --global core.eol crlf
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check out current public projects
        run: |
          foreach ($repo in @('paramichha-dev','paramichha-utils','datafactory-catalog','paramichha-datafactory','paramichha-testbuddy-demo')) {
            git clone --depth 1 --branch master "https://github.com/smmakvana/$repo.git" "$env:RUNNER_TEMP/$repo"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C "$env:RUNNER_TEMP/$repo" rev-parse HEAD
          }
      - name: Build shared Maven parent
        run: mvn -B -ntp -f "$env:RUNNER_TEMP/paramichha-dev/pom.xml" clean install
      - name: Build Utils with Spotless
        run: mvn -B -ntp -f "$env:RUNNER_TEMP/paramichha-utils/pom.xml" clean install "-Dspotless.check.skip=false"
      - name: Build DataFactory Catalog with Spotless
        run: mvn -B -ntp -f "$env:RUNNER_TEMP/datafactory-catalog/pom.xml" clean install "-Dspotless.check.skip=false"
      - name: Build DataFactory with Spotless
        run: mvn -B -ntp -f "$env:RUNNER_TEMP/paramichha-datafactory/pom.xml" clean install "-Dspotless.check.skip=false"
      - name: Build TestBuddy Demo and check expected TODO failures
        shell: bash
        run: |
          cd "$RUNNER_TEMP/paramichha-testbuddy-demo"
          mvn -B -ntp clean verify -Dmaven.test.failure.ignore=true
          sed -n "/^          python3 - <<'PY'/,/^          PY$/p" .github/workflows/build.yml | sed 's/^          //' | sed 's/^python3 /python /' > demo-check.sh
          test -s demo-check.sh
          bash demo-check.sh
